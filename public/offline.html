<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TL-Radar — Offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #18181b;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0c0c0e; color: #f4f4f5; }
  }
  .card { text-align: center; padding: 32px; max-width: 360px; }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #e20617;
    margin: 0 auto 20px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; opacity: 0.7; margin: 0 0 20px; line-height: 1.5; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: #e20617;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"></div>
    <h1>Keine Verbindung / No connection</h1>
    <p>TL-Radar braucht eine Internetverbindung. Bitte prüfen und erneut versuchen.<br />TL-Radar needs an internet connection. Please check and retry.</p>
    <button onclick="location.reload()">Erneut versuchen / Retry</button>
  </div>
</body>
</html>
