<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TL-Radar</title>
<style>
  :root{
    --bg:#F5F5F7;
    --surface:#FFFFFF;
    --border:#E4E4E7;
    --ink:#18181B;
    --ink-muted:#6B7280;
    --brand:#E20617;
    --brand-dark:#B10310;
    --waiting:#71717A;
    --progress:#2563EB;
    --paused:#D97706;
    --done:#16A34A;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;}
  .brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(226,6,23,.12);}
  .brand-mark span{font-weight:700;letter-spacing:.02em;font-size:13px;text-transform:uppercase;color:var(--brand);}
  .auth-card h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.01em;}
  .auth-card p.sub{color:var(--ink-muted);font-size:13.5px;margin:0 0 22px;line-height:1.5;}
  .user-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;max-height:260px;overflow-y:auto;}
  .user-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s;}
  .user-row:hover{border-color:var(--brand);background:#FFF7F7;}
  .user-row .name{font-weight:600;font-size:14px;}
  .role-badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:3px 8px;border-radius:100px;}
  .role-viewer{background:#EEF2FF;color:#4338CA;}
  .role-editor{background:#FEF2F2;color:var(--brand-dark);}
  .empty-note{color:var(--ink-muted);font-size:13px;padding:10px 2px;}
  .divider{height:1px;background:var(--border);margin:18px 0;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;}
  input[type=text],input[type=date],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:70px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand);}
  .radio-row{display:flex;gap:10px;}
  .radio-opt{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;text-align:center;font-size:13.5px;font-weight:600;}
  .radio-opt.sel{border-color:var(--brand);background:#FFF7F7;color:var(--brand-dark);}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .btn-primary{background:var(--brand);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-ghost{background:transparent;color:var(--ink-muted);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--ink-muted);}
  .link-btn{background:none;border:none;color:var(--brand);font-size:13.5px;font-weight:600;cursor:pointer;padding:0;}

  /* ---------- App shell ---------- */
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:16px;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:center;gap:26px;}
  .tabs{display:flex;gap:4px;}
  .tab{padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;border:1px solid transparent;}
  .tab.active{background:#FFF1F1;color:var(--brand-dark);border-color:#FFD9D9;}
  .tab:hover:not(.active){background:#F4F4F5;}
  .who{display:flex;align-items:center;gap:10px;}
  .who .name{font-size:13.5px;font-weight:600;}
  main{flex:1;padding:22px;max-width:1200px;margin:0 auto;width:100%;}
  h2.section-title{font-size:16px;margin:0 0 4px;}
  p.section-sub{color:var(--ink-muted);font-size:13px;margin:0 0 18px;}

  /* ---------- Kanban ---------- */
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:820px){.kanban{grid-template-columns:1fr;}}
  .col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;}
  .signal{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .signal.pulsing{animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.45);}70%{box-shadow:0 0 0 7px rgba(37,99,235,0);}100%{box-shadow:0 0 0 0 rgba(37,99,235,0);}}
  .col-count{color:var(--ink-muted);font-weight:600;}
  .card-stack{display:flex;flex-direction:column;gap:10px;min-height:40px;}
  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;border-left:4px solid var(--waiting);}
  .task-card .t-person{font-size:11.5px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .task-card .t-title{font-weight:700;font-size:14.5px;margin-bottom:5px;}
  .task-card .t-desc{font-size:13px;color:#3F3F46;margin-bottom:8px;line-height:1.4;}
  .t-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-muted);margin-bottom:10px;}
  .t-meta span{display:flex;align-items:center;gap:4px;}
  .t-meta .overdue{color:var(--brand);font-weight:700;}
  .t-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .t-actions .btn{padding:6px 10px;font-size:12.5px;}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:7px;width:28px;height:28px;cursor:pointer;color:var(--ink-muted);font-size:13px;}
  .icon-btn:hover{border-color:var(--ink-muted);color:var(--ink);}

  /* ---------- Archive table ---------- */
  .archive-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;}
  .archive-table th{text-align:left;background:#FAFAFA;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);border-bottom:1px solid var(--border);}
  .archive-table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
  .archive-table tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);font-size:12px;color:#3F3F46;}
  .pause-line{font-family:var(--mono);font-size:11.5px;color:var(--paused);}

  /* ---------- Form ---------- */
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:560px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn-primary{width:auto;flex:1;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
const STATUS = {
  waiting:{label:'Ожидание', color:'var(--waiting)'},
  in_progress:{label:'В процессе', color:'var(--progress)'},
  paused:{label:'Пауза', color:'var(--paused)'},
  done:{label:'Сделано', color:'var(--done)'}
};

let state = {
  users: [],
  tasks: [],
  currentUser: null,
  activeTab: 'dashboard',
  editingTaskId: null,
  regMode: false,
  regRole: 'viewer'
};

async function safeGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function safeSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); }
  catch(e){ console.error('storage set failed', e); }
}

async function init(){
  state.users = (await safeGet('users', true)) || [];
  state.tasks = (await safeGet('tasks', true)) || [];
  const session = await safeGet('session', false);
  if(session && session.userId){
    const u = state.users.find(u=>u.id===session.userId);
    if(u) state.currentUser = u;
  }
  render();
}

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }

function fmtDateTime(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('ru-RU', {timeZone:'Europe/Berlin', day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('ru-RU', {timeZone:'Europe/Berlin', day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDuration(ms){
  if(ms<0) ms=0;
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return (h>0 ? h+'ч ' : '')+m+'м';
}
function netDuration(task){
  if(!task.startedAt || !task.completedAt) return null;
  let total = new Date(task.completedAt) - new Date(task.startedAt);
  (task.pauseHistory||[]).forEach(p=>{
    if(p.pausedAt && p.resumedAt){ total -= (new Date(p.resumedAt) - new Date(p.pausedAt)); }
  });
  return total;
}
function isOverdue(task){
  if(!task.deadline) return false;
  return new Date(task.deadline) < new Date() && task.status!=='done';
}

/* ---------------- Actions ---------------- */
async function registerUser(name, role){
  name = name.trim();
  if(!name) return;
  if(state.users.some(u=>u.name.toLowerCase()===name.toLowerCase())){
    alert('Пользователь с таким именем уже существует. Выберите его в списке для входа.');
    return;
  }
  const user = {id:uid(), name, role, createdAt:new Date().toISOString()};
  state.users.push(user);
  await safeSet('users', state.users, true);
  await loginAs(user.id);
}
async function loginAs(userId){
  const u = state.users.find(u=>u.id===userId);
  if(!u) return;
  state.currentUser = u;
  state.regMode = false;
  await safeSet('session', {userId}, false);
  render();
}
async function logout(){
  state.currentUser = null;
  await safeSet('session', {userId:null}, false);
  render();
}

async function createTask(fields){
  const task = {
    id: uid(),
    person: fields.person.trim(),
    title: fields.title.trim(),
    description: (fields.description||'').trim(),
    location: (fields.location||'').trim(),
    deadline: fields.deadline || null,
    status: 'waiting',
    createdAt: new Date().toISOString(),
    startedAt: null,
    completedAt: null,
    pauseHistory: []
  };
  state.tasks.push(task);
  await safeSet('tasks', state.tasks, true);
  state.activeTab = 'dashboard';
  render();
}
async function editTaskFields(id, fields){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.person = fields.person.trim();
  t.title = fields.title.trim();
  t.description = (fields.description||'').trim();
  t.location = (fields.location||'').trim();
  t.deadline = fields.deadline || null;
  await safeSet('tasks', state.tasks, true);
  state.editingTaskId = null;
  state.activeTab = 'dashboard';
  render();
}
async function deleteTask(id){
  if(!confirm('Удалить эту задачу без возможности восстановления?')) return;
  state.tasks = state.tasks.filter(t=>t.id!==id);
  await safeSet('tasks', state.tasks, true);
  render();
}
async function setStatus(id, newStatus){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const now = new Date().toISOString();
  if(newStatus==='in_progress' && !t.startedAt){ t.startedAt = now; }
  if(t.status==='in_progress' && newStatus==='paused'){
    t.pauseHistory.push({pausedAt: now, resumedAt: null});
  }
  if(t.status==='paused' && newStatus==='in_progress'){
    const open = [...t.pauseHistory].reverse().find(p=>!p.resumedAt);
    if(open) open.resumedAt = now;
  }
  if(newStatus==='done'){
    const open = [...t.pauseHistory].reverse().find(p=>!p.resumedAt);
    if(open) open.resumedAt = now;
    t.completedAt = now;
    if(!t.startedAt) t.startedAt = now;
  }
  t.status = newStatus;
  await safeSet('tasks', state.tasks, true);
  render();
}

/* ---------------- Rendering ---------------- */
function render(){
  const root = document.getElementById('root');
  root.innerHTML = state.currentUser ? renderApp() : renderAuth();
  bindEvents();
}

function renderAuth(){
  const list = state.users.map(u=>`
    <div class="user-row" data-login="${u.id}">
      <span class="name">${escapeHtml(u.name)}</span>
      <span class="role-badge role-${u.role}">${u.role==='editor'?'Редактор':'Зритель'}</span>
    </div>`).join('');

  const regBlock = state.regMode ? `
    <div class="field">
      <label>Имя</label>
      <input type="text" id="reg-name" placeholder="Например, Anna K.">
    </div>
    <div class="field">
      <label>Роль</label>
      <div class="radio-row">
        <div class="radio-opt ${state.regRole==='viewer'?'sel':''}" data-role="viewer">Зритель</div>
        <div class="radio-opt ${state.regRole==='editor'?'sel':''}" data-role="editor">Редактор</div>
      </div>
    </div>
    <button class="btn btn-primary" id="reg-submit">Зарегистрироваться</button>
    <div style="margin-top:10px;text-align:center;">
      <button class="link-btn" id="reg-cancel">Назад к списку</button>
    </div>
  ` : `
    <div class="user-list">${list || '<div class="empty-note">Пока никто не зарегистрирован.</div>'}</div>
    <button class="link-btn" id="reg-open">+ Зарегистрироваться</button>
  `;

  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand-mark"><span class="brand-dot"></span><span>MIFCOM</span></div>
      <h1>TL-Radar</h1>
      <p class="sub">Кто чем занят и где — без лишних вопросов. Войдите под своим именем или зарегистрируйтесь.</p>
      ${regBlock}
    </div>
  </div>`;
}

function renderApp(){
  const role = state.currentUser.role;
  const tabs = [{id:'dashboard', label:'Дешборд'}];
  if(role==='editor') tabs.push({id:'form', label: state.editingTaskId ? 'Редактирование' : 'Новая задача'});
  tabs.push({id:'archive', label:'Архив'});

  const tabsHtml = tabs.map(t=>`<div class="tab ${state.activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');

  let body = '';
  if(state.activeTab==='dashboard') body = renderDashboard();
  else if(state.activeTab==='form') body = renderForm();
  else if(state.activeTab==='archive') body = renderArchive();

  return `
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand-mark"><span class="brand-dot"></span><span>TL-Radar</span></div>
      <div class="tabs">${tabsHtml}</div>
    </div>
    <div class="who">
      <span class="role-badge role-${role}">${role==='editor'?'Редактор':'Зритель'}</span>
      <span class="name">${escapeHtml(state.currentUser.name)}</span>
      <button class="btn btn-ghost" id="logout-btn">Выйти</button>
    </div>
  </div>
  <main>${body}</main>`;
}

function taskCard(t, editable){
  const overdue = isOverdue(t);
  const actions = {
    waiting: [{to:'in_progress', label:'Начать'}],
    in_progress: [{to:'paused', label:'Пауза'}, {to:'done', label:'Готово'}],
    paused: [{to:'in_progress', label:'Возобновить'}, {to:'done', label:'Готово'}]
  }[t.status] || [];

  const actionBtns = editable ? actions.map(a=>`<button class="btn btn-ghost" data-status="${t.id}|${a.to}">${a.label}</button>`).join('') : '';
  const editDel = editable ? `
    <button class="icon-btn" data-edit="${t.id}" title="Изменить">✎</button>
    <button class="icon-btn" data-del="${t.id}" title="Удалить">✕</button>` : '';

  return `
  <div class="task-card" style="border-left-color:${STATUS[t.status].color}">
    <div class="t-person">${escapeHtml(t.person)}</div>
    <div class="t-title">${escapeHtml(t.title)}</div>
    ${t.description ? `<div class="t-desc">${escapeHtml(t.description)}</div>` : ''}
    <div class="t-meta">
      ${t.location ? `<span>📍 ${escapeHtml(t.location)}</span>` : ''}
      ${t.deadline ? `<span class="${overdue?'overdue':''}">⏰ ${fmtDate(t.deadline)}${overdue?' · просрочено':''}</span>` : ''}
    </div>
    <div class="t-actions">${actionBtns}${editDel}</div>
  </div>`;
}

function renderDashboard(){
  const active = state.tasks.filter(t=>t.status!=='done');
  const editable = state.currentUser.role==='editor';
  const cols = ['waiting','in_progress','paused'];
  const colsHtml = cols.map(s=>{
    const items = active.filter(t=>t.status===s);
    const pulsing = s==='in_progress' ? 'pulsing' : '';
    return `
    <div class="kanban-col">
      <div class="col-head"><span class="signal ${pulsing}" style="background:${STATUS[s].color}"></span>${STATUS[s].label} <span class="col-count">${items.length}</span></div>
      <div class="card-stack">
        ${items.length ? items.map(t=>taskCard(t, editable)).join('') : `<div class="empty-note">Пусто.</div>`}
      </div>
    </div>`;
  }).join('');

  return `
    <h2 class="section-title">Дешборд</h2>
    <p class="section-sub">Активные задачи по статусам, в реальном времени.</p>
    <div class="kanban">${colsHtml}</div>`;
}

function renderForm(){
  const editing = state.editingTaskId ? state.tasks.find(t=>t.id===state.editingTaskId) : null;
  return `
    <h2 class="section-title">${editing ? 'Редактирование задачи' : 'Новая задача'}</h2>
    <p class="section-sub">Заполните поля — задача появится на дешборде со статусом «Ожидание».</p>
    <div class="form-card">
      <div class="row2">
        <div class="field"><label>Человек</label><input type="text" id="f-person" value="${editing?escapeHtml(editing.person):''}" placeholder="Кто выполняет"></div>
        <div class="field"><label>Дедлайн</label><input type="date" id="f-deadline" value="${editing&&editing.deadline?editing.deadline.slice(0,10):''}"></div>
      </div>
      <div class="field"><label>Название задачи</label><input type="text" id="f-title" value="${editing?escapeHtml(editing.title):''}" placeholder="Кратко, суть задачи"></div>
      <div class="field"><label>Описание</label><textarea id="f-desc" placeholder="Детали задачи">${editing?escapeHtml(editing.description):''}</textarea></div>
      <div class="field"><label>Место проведения</label><input type="text" id="f-loc" value="${editing?escapeHtml(editing.location):''}" placeholder="Где физически проходит"></div>
      <div class="form-actions">
        <button class="btn btn-primary" id="f-submit">${editing?'Сохранить изменения':'Добавить задачу'}</button>
        ${editing?'<button class="btn btn-ghost" id="f-cancel">Отмена</button>':''}
      </div>
    </div>`;
}

function renderArchive(){
  const done = state.tasks.filter(t=>t.status==='done').sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(!done.length){
    return `<h2 class="section-title">Архив</h2><p class="section-sub">Сюда попадают завершённые задачи.</p><div class="empty-note">Архив пока пуст.</div>`;
  }
  const rows = done.map(t=>{
    const pauses = (t.pauseHistory||[]).map(p=>`<div class="pause-line">⏸ ${fmtDateTime(p.pausedAt)} → ▶ ${p.resumedAt?fmtDateTime(p.resumedAt):'—'}</div>`).join('') || '<span class="mono">—</span>';
    const net = netDuration(t);
    return `<tr>
      <td><strong>${escapeHtml(t.title)}</strong><br><span class="mono">${escapeHtml(t.person)}</span></td>
      <td>${escapeHtml(t.location)||'—'}</td>
      <td class="mono">${fmtDateTime(t.createdAt)}</td>
      <td class="mono">${fmtDateTime(t.startedAt)}</td>
      <td class="mono">${fmtDateTime(t.completedAt)}</td>
      <td>${pauses}</td>
      <td class="mono">${net!==null?fmtDuration(net):'—'}</td>
    </tr>`;
  }).join('');

  return `
    <h2 class="section-title">Архив</h2>
    <p class="section-sub">Завершённые задачи, отсортированы по времени внесения (новые сверху).</p>
    <table class="archive-table">
      <thead><tr>
        <th>Задача / человек</th><th>Место</th><th>Внесена</th><th>Начата</th><th>Завершена</th><th>Паузы</th><th>Чистое время</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Event binding ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-login]').forEach(el=>{
    el.onclick = ()=> loginAs(el.getAttribute('data-login'));
  });
  const regOpen = document.getElementById('reg-open');
  if(regOpen) regOpen.onclick = ()=>{ state.regMode=true; render(); };
  const regCancel = document.getElementById('reg-cancel');
  if(regCancel) regCancel.onclick = ()=>{ state.regMode=false; render(); };
  document.querySelectorAll('[data-role]').forEach(el=>{
    el.onclick = ()=>{ state.regRole = el.getAttribute('data-role'); render(); };
  });
  const regSubmit = document.getElementById('reg-submit');
  if(regSubmit) regSubmit.onclick = ()=>{
    const name = document.getElementById('reg-name').value;
    registerUser(name, state.regRole);
  };

  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.onclick = logout;

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{
      state.activeTab = el.getAttribute('data-tab');
      if(state.activeTab!=='form') state.editingTaskId = null;
      render();
    };
  });

  document.querySelectorAll('[data-status]').forEach(el=>{
    el.onclick = ()=>{
      const [id, to] = el.getAttribute('data-status').split('|');
      setStatus(id, to);
    };
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{
      state.editingTaskId = el.getAttribute('data-edit');
      state.activeTab = 'form';
      render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=> deleteTask(el.getAttribute('data-del'));
  });

  const fSubmit = document.getElementById('f-submit');
  if(fSubmit) fSubmit.onclick = ()=>{
    const fields = {
      person: document.getElementById('f-person').value,
      title: document.getElementById('f-title').value,
      description: document.getElementById('f-desc').value,
      location: document.getElementById('f-loc').value,
      deadline: document.getElementById('f-deadline').value
    };
    if(!fields.person.trim() || !fields.title.trim()){
      alert('Заполните хотя бы «Человек» и «Название задачи».');
      return;
    }
    if(state.editingTaskId) editTaskFields(state.editingTaskId, fields);
    else createTask(fields);
  };
  const fCancel = document.getElementById('f-cancel');
  if(fCancel) fCancel.onclick = ()=>{ state.editingTaskId=null; state.activeTab='dashboard'; render(); };
}

init();
</script>
</body>
</html>
